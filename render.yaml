services:
  - type: web
    name: cycleclub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: APP_NAME
        value: CycleClub Analytics
      - key: STRAVA_MODE
        value: real
